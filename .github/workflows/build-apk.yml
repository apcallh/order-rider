name: Build Order Rider APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Backup source
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib

      - name: Generate Android shell
        run: flutter create --org com.orderrider --project-name order_rider --platforms android .

      - name: Restore source
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib lib

      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' $M
          sed -i 's#android:label="order_rider"#android:label="Order Rider"#g' $M

      - name: Get dependencies
        run: flutter pub get

      - name: Patch app_links Android compatibility
        run: |
          APP_LINKS_GRADLE=$(find "$PUB_CACHE/hosted/pub.dev" -path '*/app_links-*/android/build.gradle' -print -quit)
          test -n "$APP_LINKS_GRADLE"
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' "$APP_LINKS_GRADLE"

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: order-rider-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
